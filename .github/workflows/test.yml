name: Testes CIVOLTEN
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4 # v4.2.2
      - name: Instalar Node
        uses: actions/setup-node@v4 # v4.4.0
        with:
          node-version: '22.13.1'
      - name: Testar
        run: npm test