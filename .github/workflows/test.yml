name: Testes CIVOLTEN
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Instalar Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.13.1'
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Testar
        run: npm test
      - name: Validar integridade das fontes SIURB sem conectar ao banco
        run: npm run validate:siurb
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: civolten_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-ephemeral-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d civolten_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ci-ephemeral-password
      CIVOLTEN_TEST_DATABASE_URL: postgres://postgres:ci-ephemeral-password@127.0.0.1:5432/civolten_test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.13.1'
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Aplicar migrações SQL no PostgreSQL temporário
        shell: bash
        run: |
          set -euo pipefail
          for file in db/migrations/0*.sql; do
            psql -v ON_ERROR_STOP=1 -d civolten_test -f "$file"
          done
      - name: Validar API real com autenticação, papéis, orçamento e auditoria
        run: node --test tests/db-integration.test.mjs
      - name: Custo-hora real por salario, encargos e jornada em PostgreSQL temporario
        run: node --test tests/company-worker-payroll-db-integration.test.mjs
      - name: Engenharia de custos - integração real PostgreSQL e SIURB
        run: node --test tests/costing-integration.test.mjs
      - name: Backup e restauração com dados fictícios já gravados
        shell: bash
        run: |
          set -euo pipefail
          createdb civolten_restored
          # Use pg_dump/pg_restore 17 within the disposable Postgres service,
          # not the older PostgreSQL client preinstalled on the GitHub runner.
          postgres_container="$(docker ps --filter 'ancestor=postgres:17' --format '{{.ID}}' | head -n 1)"
          test -n "$postgres_container"
          backup="$(mktemp)"
          trap 'rm -f "$backup"' EXIT
          docker exec -e PGPASSWORD="$PGPASSWORD" "$postgres_container" pg_dump -h 127.0.0.1 -U postgres --no-owner --no-privileges --format=custom civolten_test > "$backup"
          test -s "$backup"
          docker exec -i -e PGPASSWORD="$PGPASSWORD" "$postgres_container" pg_restore -h 127.0.0.1 -U postgres --no-owner --no-privileges --exit-on-error --dbname=civolten_restored < "$backup"
          before="$(psql -At -d civolten_test -c 'SELECT count(*) FROM clients')"
          after="$(psql -At -d civolten_restored -c 'SELECT count(*) FROM clients')"
          test "$before" -gt 0
          test "$before" = "$after"
          before_budget="$(psql -At -d civolten_test -c 'SELECT count(*) FROM budgets')"
          after_budget="$(psql -At -d civolten_restored -c 'SELECT count(*) FROM budgets')"
          test "$before_budget" -gt 0
          test "$before_budget" = "$after_budget"
          before_items="$(psql -At -d civolten_test -c 'SELECT count(*) FROM budget_items')"
          after_items="$(psql -At -d civolten_restored -c 'SELECT count(*) FROM budget_items')"
          test "$before_items" = "$after_items"
          echo "PASS backup and restore: clients=$after budgets=$after_budget items=$after_items"
      - name: Backup criptografado age e restauração em terceiro banco descartável
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq age
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          age-keygen -o "$temp_dir/secret.key" >/dev/null 2>&1
          public_key="$(age-keygen -y "$temp_dir/secret.key")"
          postgres_container="$(docker ps --filter 'ancestor=postgres:17' --format '{{.ID}}' | head -n 1)"
          test -n "$postgres_container"
          docker exec -e PGPASSWORD="$PGPASSWORD" "$postgres_container" pg_dump -h 127.0.0.1 -U postgres --format=custom --no-owner --no-privileges civolten_test |
            age -r "$public_key" -o "$temp_dir/civolten-qa.dump.age"
          test -s "$temp_dir/civolten-qa.dump.age"
          createdb civolten_encrypted_restored
          age -d -i "$temp_dir/secret.key" "$temp_dir/civolten-qa.dump.age" |
            docker exec -i -e PGPASSWORD="$PGPASSWORD" "$postgres_container" pg_restore -h 127.0.0.1 -U postgres --no-owner --no-privileges --exit-on-error -d civolten_encrypted_restored
          for table in clients projects budgets budget_items audit_events; do
            expected="$(psql -At -d civolten_test -c "SELECT count(*) FROM $table")"
            actual="$(psql -At -d civolten_encrypted_restored -c "SELECT count(*) FROM $table")"
            test "$expected" = "$actual"
            echo "PASS encrypted restore $table count=$actual"
          done
          echo "PASS: encrypted archive can be decrypted and restored with its private key; no key persisted"

  smoke-live:
    # Read-only checks against the real public production URL after all code and DB tests.
    # Never send credentials, create records or expose protected data.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [tests, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.13.1'
      - name: Verificar API, Neon, autenticação e arquivos do CIVOLTEN publicado
        run: node scripts/verify-remote-stage1.mjs
