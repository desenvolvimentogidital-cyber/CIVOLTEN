name: Importar fotografias de referência aprovadas
on:
  push:
    branches: [feat/layout-premium-home-dashboard-out2026]
    paths: [.github/civolten-art-manifest.json]
permissions:
  contents: write
jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar conversor de imagem
        run: python3 -m pip install --user Pillow
      - name: Baixar arquivos com proteção e otimizar
        run: |
          python3 - <<'PY'
          import json,pathlib,urllib.request,io
          from PIL import Image
          manifest=pathlib.Path('.github/civolten-art-manifest.json')
          rows=json.loads(manifest.read_text())['images']
          folder=pathlib.Path('assets/media');folder.mkdir(parents=True,exist_ok=True)
          for r in rows:
            with urllib.request.urlopen(r['url'],timeout=35) as response:
              data=response.read(1200000)
            img=Image.open(io.BytesIO(data)).convert('RGB')
            if img.width<100 or img.height<100:raise RuntimeError('Imagem muito pequena')
            path=folder/r['filename'];img.save(path,format='JPEG',quality=82,optimize=True)
            print(path,img.size,path.stat().st_size)
          manifest.unlink()
          PY
      - name: Salvar as fotografias no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/media
          git add -u .github/civolten-art-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "assets: include original approved CIVOLTEN-generated photographs"
            git push
          fi
