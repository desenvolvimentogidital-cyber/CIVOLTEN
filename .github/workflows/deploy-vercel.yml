# CIVOLTEN: publica o commit que passou nos testes, sem usar a API de deploy do ChatGPT.
# A publicacao usa o CLI da Vercel, dentro do GitHub Actions.
name: CIVOLTEN — publicar na Vercel após testes
on:
  workflow_run:
    workflows:
      - "CIVOLTEN — interface premium e cálculos"
    types: [completed]

permissions:
  contents: read

concurrency:
  group: civolten-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Evita executar código de pull requests com token de produção.
    # Publica somente o push na main que passou em todos os testes.
    if: >-
      ${{
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      VERCEL_ORG_ID: team_5riNeVAJVfakHxuvcW1pGMXM
      VERCEL_PROJECT_ID: prj_rD5nuIakujmss9n36L6sc199URTq
      VERCEL_CLI_VERSION: '65.12.1'
      CI_COMMIT: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout do commit aprovado pelo CI
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Não publicar commit antigo se a main avançou
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          latest="$(git rev-parse refs/remotes/origin/main)"
          if [ "$latest" != "$CI_COMMIT" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Nova atualização encontrada na main. Este deploy antigo foi ignorado."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Publicando commit aprovado: $CI_COMMIT"
          fi

      - name: Validar credencial de implantação
        if: steps.commit.outputs.publish == 'true'
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::error::Falta o segredo VERCEL_TOKEN em GitHub → Settings → Secrets and variables → Actions."
            echo "::error::Crie o token em https://vercel.com/account/tokens e cadastre-o SOMENTE no cofre do GitHub."
            exit 1
          fi

      - name: Preparar Node.js
        if: steps.commit.outputs.publish == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar Vercel CLI (versão fixa)
        if: steps.commit.outputs.publish == 'true'
        shell: bash
        run: npm install --global "vercel@$VERCEL_CLI_VERSION" --no-audit --no-fund

      - name: Obter configurações de Production
        if: steps.commit.outputs.publish == 'true'
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production

      - name: Preparar build de produção no GitHub Actions
        if: steps.commit.outputs.publish == 'true'
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod

      - name: Publicar build testado na Vercel
        if: steps.commit.outputs.publish == 'true'
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          url="$(vercel deploy --prebuilt --prod --yes)"
          case "$url" in
            https://*.vercel.app) ;;
            *) echo "::error::Resposta inesperada da implantação"; exit 1 ;;
          esac
          {
            echo "## Publicação CIVOLTEN concluída"
            echo ""
            echo "- Commit testado: \`$CI_COMMIT\`"
            echo "- Ambiente: Production"
            echo "- URL: $url"
            echo "- Site: https://civolten.vercel.app"
          } >> "$GITHUB_STEP_SUMMARY"
