name: SIURB 2026-07 suplementos auditados em branch de revisão
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/prepare-official-siurb-supplements.yml

permissions:
  contents: write
  actions: read

jobs:
  publish-to-review-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout origin
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Parse official legacy XLS
        run: python -m pip install --disable-pip-version-check xlrd==2.0.2
      - name: Recover audited eight-source archive (no customer data)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: siurb-supplements-schema-audit
          run-id: 40960856431
          path: artifacts
          github-token: ${{ github.token }}
      - name: Verify archived SHA256 or re-audit official public sources
        run: |
          set -euo pipefail
          if [[ -f artifacts/siurb-supplements-audit.json && -d artifacts/siurb-source-files ]]; then
            echo 'Hashes de arquivo serão conferidos durante a normalização.'
          else
            python scripts/audit-siurb-supplements.py --output artifacts/siurb-supplements-audit.json
          fi
      - name: Normalize all 8 sources against manifest SHA256
        run: python scripts/build-siurb-supplements.py
      - name: Reconcile actual SIURB service composition vs prices
        run: node scripts/reconcile-siurb-services.mjs
      - name: Audit and export 8 reviewable JSON tables
        run: node scripts/export-audited-siurb-supplements.mjs
      - name: Publish only public audited data on separate review branch
        shell: bash
        run: |
          set -euo pipefail
          branch='data/siurb-supplements-2026-07-audited-20261031'
          if git ls-remote --exit-code origin "refs/heads/$branch" >/dev/null 2>&1; then
            echo "::notice::A branch de dados já existe; não a sobrescrever. Abra ou atualize um pull request manualmente."
            exit 0
          fi
          git config user.name 'civolten-siurb-ci'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add data/siurb-supplements-2026-07/
          git diff --cached --quiet && { echo "::error::Dataset não criado"; exit 1; }
          git commit -m "data(siurb): published verified July 2026 supplemental tariffs (review only)"
          git push --set-upstream origin "$branch"
          echo "::notice::Fonte oficial publicada somente para revisão. Dados de produção Neon não alterados."
