name: CIVOLTEN Base - custos e equipe
on:
  push:
    branches: [main]
    paths: ['core/**','client/login.mjs','scripts/build.mjs','index.html','sw.js','auth-screen.js','tests/core-costs.cjs','tests/auth-screen.cjs','tests/cloud-state.cjs','tests/smoke-browser.cjs','package.json','vercel.json','.github/workflows/cloud-backend.yml']
  pull_request:
    paths: ['core/**','client/**','scripts/**','index.html','sw.js','auth-screen.js','tests/**','package.json','vercel.json','.github/workflows/cloud-backend.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-base:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Instalar bibliotecas versionadas
        run: npm install --no-audit --no-fund
      - name: Compilar CIVOLTEN e login
        env:
          NEON_AUTH_BASE_URL: https://example.invalid/civolten/auth
          CIVOLTEN_BROWSER_TEST_MODE: 'true'
        run: npm run build
      - name: Conferir somente telas novas
        run: |
          test -s dist/index.html
          test -s dist/auth-screen.js
          test -s dist/core/cost-engine.js
          test -s dist/core/app.js
          test -s dist/core/styles.css
          test -s dist/login.js
          test -s dist/sw.js
          test ! -e dist/daily-workflow.js
          test ! -e dist/siurb.js
          test ! -e dist/workforce-schedule.js
          test ! -e dist/operations.js
      - name: Validar motor de custo, login e contratos de API
        run: npm test
      - name: Conferir sintaxe dos arquivos ativos
        run: |
          node --check core/cost-engine.js
          node --check core/app.js
          node --check auth-screen.js
          node --check client/login.mjs
          node --check scripts/build.mjs
      - name: Instalar Chromium gratuito
        run: npx playwright install --with-deps chromium
      - name: Testar navegação, custos, equipe e dados preservados
        run: npm run test:browser
