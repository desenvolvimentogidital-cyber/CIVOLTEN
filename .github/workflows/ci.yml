name: CIVOLTEN Static CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check-static:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install PDF dependency
        run: npm install --no-audit --no-fund
      - name: Static, security and PDF checks
        run: npm test
      - name: Generate sample PDFs for visual QA
        run: node scripts/generate-pdf-preview.mjs
      - name: Upload visual PDF samples
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: civolten-pdf-v2-samples
          path: preview-artifacts/*.pdf
          retention-days: 3
