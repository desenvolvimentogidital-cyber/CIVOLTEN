name: Publicar custos SIURB oficiais
on:
  push:
    branches: [main]
    paths:
      - 'scripts/publish_siurb_2026.py'
      - '.github/workflows/publish-siurb.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: siurb-import
  cancel-in-progress: false
jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Baixar código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Configurar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Instalar leitor XLS
        run: python -m pip install xlrd==2.0.2
      - name: Baixar e validar preços oficiais
        run: python scripts/publish_siurb_2026.py
      - name: Salvar catálogo validado no repositório
        run: |
          git add public/data/siurb-2026-07.json
          if git diff --cached --quiet; then
            echo "Catálogo SIURB sem alterações"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data(siurb): atualizar catálogo oficial jul/2026 verificado"
          git push origin HEAD:main
