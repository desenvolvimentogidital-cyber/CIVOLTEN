name: CIVOLTEN — interface premium e cálculos
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Guardar lockfile para reprodução do build
        uses: actions/upload-artifact@v4
        with:
          name: civolten-package-lock
          path: package-lock.json
          if-no-files-found: error
      - name: Testes de cálculos e dados locais
        run: npm test
      - name: Construir somente as telas novas
        env:
          NEON_AUTH_BASE_URL: https://example.invalid/neon/auth
          CIVOLTEN_E2E: 'true'
        run: npm run build
      - name: Conferir o build e ativos da marca
        run: |
          test -s dist/index.html
          test -s dist/aceite.html
          test -s dist/site/index.html
          test -s dist/site/politica-de-privacidade.html
          test -s dist/aceite.js
          test -s dist/aceite.css
          test -s dist/app.js
          test -s dist/styles.css
          test -s dist/assets/civolten-logo.png
          test -s dist/assets/civolten-simbolo.png
          test -s dist/assets/skyline.svg
          test -s dist/assets/proposal-construction.svg
          test -s dist/assets/proposal-photo-atlas.webp
          test -s dist/assets/file_000000007df8820eb700b32dbfca9c55.png
          node --check src/budget-print.mjs
          node --check scripts/build.mjs
          node --check src/main.mjs
          node --check src/views.mjs
          node --check src/calc.mjs
          node --check src/cloud.mjs
          node --check src/operations.mjs
          node --check src/operations-ui.mjs
          node --check src/work-order-print.mjs
          node --check src/schedule-print.mjs
          node --check src/field-progress.mjs
          node --check src/field-progress-ui.mjs
          node --check src/field-evidence.mjs
          node --check src/proposal-link.mjs
          node --check src/public-aceite.mjs
          node --check src/proposal-inbox.mjs
          node --check src/proposal-inbox-ui.mjs
          node --check src/e2e-client.mjs
          node --check src/finance.mjs
          node --check src/finance-ui.mjs
          node --check src/pricing.mjs
          node --check src/settings-ui.mjs
          node --check src/budget.mjs
          node --check src/budget-ui.mjs
          node --check src/catalog-import.mjs
          node --check src/catalog-xls.mjs
          node --check src/catalog-ui.mjs
          node --check src/service-catalog.mjs
          node --check src/budget-print.mjs
      - name: Instalar Chromium gratuito
        run: npx playwright install --with-deps chromium
      - name: Testar login e navegação no celular
        run: npm run test:browser
      - name: Testar catálogo importado no orçamento pelo celular
        run: node tests/budget-browser.cjs
      - name: Validar aceite de cliente no PDF e criação de OS
        run: node tests/proposal-browser.cjs
      - name: Conferir PDF A4 da ordem de serviço modelo 3
        run: node tests/work-order-print-browser.cjs
      - name: Conferir impressão A4 do cronograma para campo
        run: node tests/schedule-print-browser.cjs
      - name: Guardar capturas do aplicativo e módulos financeiros
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-civolten-premium
          path: test-artifacts/
          if-no-files-found: ignore
