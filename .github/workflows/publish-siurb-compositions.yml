name: Publicar composições oficiais SIURB
on:
  push:
    branches: [main]
    paths:
      - 'scripts/publish_siurb_compositions_2026.py'
      - '.github/workflows/publish-siurb-compositions.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: siurb-compositions-import
  cancel-in-progress: false
jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install xlrd==2.0.2
      - name: Gerar catálogo das composições com rastreabilidade
        run: python scripts/publish_siurb_compositions_2026.py
      - name: Publicar dados revisados
        run: |
          git add public/data/siurb-compositions-2026-07.json
          if git diff --cached --quiet; then
            echo "Composições sem alterações."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data(siurb): composições jul/2026 com insumos e horas diretas rastreáveis"
          git push origin HEAD:main
