name: Import approved CIVOLTEN assets
on:
  push:
    branches:
      - feat/visual-aprovado-e-refatoracao-20261019
    paths:
      - .github/workflows/import-approved-artworks.yml
permissions:
  contents: write
jobs:
  import-images:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download approved imagery from temporary staging
        env:
          IMG_HERO: "https://media.canva.com/v2/image-resize/format:PNG/height:112/quality:100/uri:ifs%3A%2F%2FM%2Fbb0515ee-2bf3-4b3c-88e2-83a34811c9f5/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAJVDdNXVijU7vdAucLJxKZRQ1wt5aIBNG1PUn1HPs_Bu&exp=1792441185&osig=AAAAAAAAAAAAAAAAAAAAAC6-Z_YjqUMsPpdNhfqu2Bim1CUKRGqSX7OeZyk6wew3&signer=media-rpc&token=AAIAAU0AJGJiMDUxNWVlLTJiZjMtNGIzYy04OGUyLTgzYTM0ODExYzlmNQAAAAABoVXR8uhE-Or3G1E0pQzPF2mUrgNFDTtwJ253pdEiCqgmFkdWzw&x-canva-quality=thumbnail"
          IMG_BACKGROUND: "https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2Fcacf8254-287e-4cdc-9847-fa4f366bc077/watermark:F/width:112?csig=AAAAAAAAAAAAAAAAAAAAAEDRsvhFMNyEm2Obw-F4OCjae4PlqTZC967Sf-TUY5cC&exp=1792439411&osig=AAAAAAAAAAAAAAAAAAAAALYPWmSZD2mBTkEEYJCVCEnJ1v0ocYWlehZeftNBYULM&signer=media-rpc&token=AAIAAU0AJGNhY2Y4MjU0LTI4N2UtNGNkYy05ODQ3LWZhNGYzNjZiYzA3NwAAAAABoVW24Th35uzZ_xkg7uVVqkAArJM7Ak7NZKEZYX7S6ICon_cmYg&x-canva-quality=thumbnail"
          IMG_ELETRICA: "https://media.canva.com/v2/image-resize/format:PNG/height:150/quality:100/uri:ifs%3A%2F%2FM%2F436ca3d1-04e6-4407-8d42-bbfec478eff3/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAGuUqL-GDsv6CDeJrGgUo3nGZgqoOMLsJ5kbOcm-XJTb&exp=1792438553&osig=AAAAAAAAAAAAAAAAAAAAAETgeqHVpM4Ma6PvSFCHYvHrbGAy7L9YJsH9p6OdJd02&signer=media-rpc&token=AAIAAU0AJDQzNmNhM2QxLTA0ZTYtNDQwNy04ZDQyLWJiZmVjNDc4ZWZmMwAAAAABoVWpyagYyCk5Mo4XXq-DZACfwI_xSFbPk8lB9DikqVSR9ZVyhg&x-canva-quality=thumbnail"
          IMG_ALVENARIA: "https://media.canva.com/v2/image-resize/format:PNG/height:150/quality:100/uri:ifs%3A%2F%2FM%2F046574bf-2408-4867-b49b-c8063f7d2d9f/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAI6fPzK-8u_tZTTsh5niityaFwi5FDENmNHQ8hGEuye7&exp=1792441551&osig=AAAAAAAAAAAAAAAAAAAAAIxxs5N0mm6H00c9d8LxRDBLYQiVaaqaR55g4dbmvs15&signer=media-rpc&token=AAIAAU0AJDA0NjU3NGJmLTI0MDgtNDg2Ny1iNDliLWM4MDYzZjdkMmQ5ZgAAAAABoVXXiJjvt1zSObfpX_j2HUOxlgL8VYjSepdRCT5eZyJwH7hOIg&x-canva-quality=thumbnail"
          IMG_REFORMA: "https://media.canva.com/v2/image-resize/format:PNG/height:150/quality:100/uri:ifs%3A%2F%2FM%2F5bf133f1-65f7-4e6b-a581-1fb179b190fb/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAIOQXvjY6bJQkdvidi-668J9ySDs0j2V7RsvO1w0lXry&exp=1792438488&osig=AAAAAAAAAAAAAAAAAAAAAIdUyrPGFZs30BXQTyTOYqPNv_rcn_lW-FVnKi9fzLH7&signer=media-rpc&token=AAIAAU0AJDViZjEzM2YxLTY1ZjctNGU2Yi1hNTgxLTFmYjE3OWIxOTBmYgAAAAABoVWoy8DnZa8GbWztZAb-aSe3Bb0i77GuqprelQ0ea97Xl0rrdg&x-canva-quality=thumbnail"
          IMG_PINTURA: "https://media.canva.com/v2/image-resize/format:PNG/height:150/quality:100/uri:ifs%3A%2F%2FM%2F7f85edca-9cb1-498f-bfc6-22c12d1212f3/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAAcWqjOdqPhRhPGhFBqGPLbPHrP4t-2KyvabRlg5_6D1&exp=1792439915&osig=AAAAAAAAAAAAAAAAAAAAAPHegte1qtSAJVPVS24q1FQP_0QPyWFvzofkdAufP_I9&signer=media-rpc&token=AAIAAU0AJDdmODVlZGNhLTljYjEtNDk4Zi1iZmM2LTIyYzEyZDEyMTJmMwAAAAABoVW-kfg-NaQMVWArHHsG8thRV0rPAvCylbJD7rdqvJTzivr_vA&x-canva-quality=thumbnail"
          IMG_DRYWALL: "https://media.canva.com/v2/image-resize/format:PNG/height:150/quality:100/uri:ifs%3A%2F%2FM%2Fc06bb7ee-e20e-46e6-a2ed-3df9206de8c9/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAANv6diXJcwmI3bJRXOLB5G1GrmZxncE11sjkkl2qhPXW&exp=1792439408&osig=AAAAAAAAAAAAAAAAAAAAADbOdTQeF7ioaRxEdFtR9d2y7skl-Gpe1X27BEmokKR5&signer=media-rpc&token=AAIAAU0AJGMwNmJiN2VlLWUyMGUtNDZlNi1hMmVkLTNkZjkyMDZkZThjOQAAAAABoVW21YCt-q6BPs-m8V35dU-C8mP8Nfqz0KcdU9489jGCUfWZhw&x-canva-quality=thumbnail"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/images
          # Try full-resolution access; fall back to the signed thumbnail if Canva restricts a resize.
          src="$IMG_HERO"
          hi="${src/height:112/height:941}"
          hi="${hi/width:200/width:1672}"
          if ! curl -fsSL --retry 2 --max-time 55 "$hi" -o "assets/images/hero.png"; then
            curl -fsSL --retry 3 --max-time 55 "$src" -o "assets/images/hero.png"
          fi
          test "$(file --brief --mime-type "assets/images/hero.png")" = "image/png"

          # Try full-resolution access; fall back to the signed thumbnail if Canva restricts a resize.
          src="$IMG_BACKGROUND"
          hi="${src/height:200/height:1672}"
          hi="${hi/width:112/width:941}"
          if ! curl -fsSL --retry 2 --max-time 55 "$hi" -o "assets/images/background.png"; then
            curl -fsSL --retry 3 --max-time 55 "$src" -o "assets/images/background.png"
          fi
          test "$(file --brief --mime-type "assets/images/background.png")" = "image/png"

          # Try full-resolution access; fall back to the signed thumbnail if Canva restricts a resize.
          src="$IMG_ELETRICA"
          hi="${src/height:150/height:1086}"
          hi="${hi/width:200/width:1448}"
          if ! curl -fsSL --retry 2 --max-time 55 "$hi" -o "assets/images/eletrica.png"; then
            curl -fsSL --retry 3 --max-time 55 "$src" -o "assets/images/eletrica.png"
          fi
          test "$(file --brief --mime-type "assets/images/eletrica.png")" = "image/png"

          # Try full-resolution access; fall back to the signed thumbnail if Canva restricts a resize.
          src="$IMG_ALVENARIA"
          hi="${src/height:150/height:1086}"
          hi="${hi/width:200/width:1448}"
          if ! curl -fsSL --retry 2 --max-time 55 "$hi" -o "assets/images/alvenaria.png"; then
            curl -fsSL --retry 3 --max-time 55 "$src" -o "assets/images/alvenaria.png"
          fi
          test "$(file --brief --mime-type "assets/images/alvenaria.png")" = "image/png"

          # Try full-resolution access; fall back to the signed thumbnail if Canva restricts a resize.
          src="$IMG_REFORMA"
          hi="${src/height:150/height:1086}"
          hi="${hi/width:200/width:1448}"
          if ! curl -fsSL --retry 2 --max-time 55 "$hi" -o "assets/images/reforma.png"; then
            curl -fsSL --retry 3 --max-time 55 "$src" -o "assets/images/reforma.png"
          fi
          test "$(file --brief --mime-type "assets/images/reforma.png")" = "image/png"

          # Try full-resolution access; fall back to the signed thumbnail if Canva restricts a resize.
          src="$IMG_PINTURA"
          hi="${src/height:150/height:1086}"
          hi="${hi/width:200/width:1448}"
          if ! curl -fsSL --retry 2 --max-time 55 "$hi" -o "assets/images/pintura.png"; then
            curl -fsSL --retry 3 --max-time 55 "$src" -o "assets/images/pintura.png"
          fi
          test "$(file --brief --mime-type "assets/images/pintura.png")" = "image/png"

          # Try full-resolution access; fall back to the signed thumbnail if Canva restricts a resize.
          src="$IMG_DRYWALL"
          hi="${src/height:150/height:1086}"
          hi="${hi/width:200/width:1448}"
          if ! curl -fsSL --retry 2 --max-time 55 "$hi" -o "assets/images/drywall.png"; then
            curl -fsSL --retry 3 --max-time 55 "$src" -o "assets/images/drywall.png"
          fi
          test "$(file --brief --mime-type "assets/images/drywall.png")" = "image/png"

      - name: Commit the optimized source images into the branch
        shell: bash
        run: |
          git config user.name "CIVOLTEN Asset Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images
          if ! git diff --cached --quiet; then
            git commit -m "assets: include approved CIVOLTEN image files"
            git push
          fi
