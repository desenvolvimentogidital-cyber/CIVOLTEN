name: Importar artes originais CIVOLTEN
on:
  push:
    branches:
      - feat/proposta-original-artes-exatas
    paths:
      - .github/workflows/import-proposal-art.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node .github/scripts/import-proposal-art.mjs
      - name: Incorporar arquivos originais
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/proposal-art/
          git diff --cached --quiet && exit 0
          git commit -m "assets: adicionar sete artes originais CIVOLTEN ao PDF"
          git push
