name: Inspecionar layouts oficiais SIURB
on:
  push:
    branches: [main]
    paths:
      - 'scripts/inspect_siurb_2026.py'
      - '.github/workflows/inspect-siurb.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspecionar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Instalar leitor XLS
        run: python -m pip install xlrd==2.0.2
      - name: Inspecionar planilhas da fonte oficial
        run: python scripts/inspect_siurb_2026.py
