function home(){const approved=db.quotes.filter(q=>q.status==='Aprovado');const total=db.quotes.reduce((v,q)=>v+num(q.price),0);return `<section class="screen dashboard"><div class="top-dark">${appbar()}<div class="page-head"><h1>Bem-vindo à CIVOLTEN <span style="color:#ffca56">✦</span></h1><p>Acompanhe seus orçamentos com precisão.</p></div></div><div class="app-content"><div class="metric feature"><div class="m-icon">${I('file')}</div><div style="flex:1"><div class="m-label">Orçamentos cadastrados</div><div class="m-num">${db.quotes.length}</div><div class="sub-growth">Dados de demonstração</div></div>${I('chevron')}</div><div class="cards-grid" style="margin-top:11px"><div class="metric"><div class="m-icon">${I('check')}</div><div class="m-label">Aprovados</div><div class="m-num">${approved.length}</div><span class="growth">Propostas confirmadas</span></div><div class="metric"><div class="m-icon">${I('coins')}</div><div class="m-label">Valor das propostas</div><div class="m-num money">${cash(total)}</div><span class="growth">Não é faturamento</span></div></div><div class="shortcuts-block"><h3 class="section-heading dark-heading">Acesso rápido</h3><div class="shortcut-grid"><button class="shortcut primary" data-action="new">${I('plus')}<span>Novo<br>orçamento</span></button><button class="shortcut" data-page="clients">${I('users')}<span>Clientes</span></button><button class="shortcut" data-page="services">${I('package')}<span>Itens e<br>custos</span></button><button class="shortcut" data-page="settings">${I('settings')}<span>Config.<br>empresa</span></button></div></div><div style="height:13px"></div><h3 class="mini-title">Orçamentos recentes</h3>${db.quotes.slice().reverse().slice(0,3).map(q=>`<div class="recent-card clickable" data-action="detail" data-id="${q.id}"><span class="recent-ico">${I('file')}</span><span class="recent-main"><strong>${esc(q.clientName)}</strong><small>${esc(q.title)}</small></span><span class="recent-tail">${sbadge(q.status)}<b>${cash(q.price)}</b></span></div>`).join('')}<p class="pwa-note">Prévia com dados fictícios • Ainda não conectado ao banco</p></div></section>`}
function splash(){return `<section class="screen splash"><div class="splash-scene"><svg class="skyline" viewBox="0 0 440 170" preserveAspectRatio="xMidYMax slice"><rect x="0" y="105" width="74" height="75"/><rect x="56" y="66" width="103" height="114"/><rect x="135" y="92" width="65" height="88"/><rect x="184" y="41" width="109" height="139"/><rect x="285" y="85" width="95" height="95"/><rect x="366" y="121" width="74" height="60"/><path d="M20 29h7v110h-7zM-10 40h177v5H-10zM20 41l65 42 5-2-65-40zM335 0h4v175h-4zM249 30h190v5H249zM337 35l75 57 4-3-74-54z"/></svg><img class="splash-sym" src="${assets.symbol}" alt="Ícone CIVOLTEN"></div><div class="splash-brand">${pwaLogo()}<p>Orçamentos profissionais para projetos elétricos e construção civil.</p><div class="gold-line"></div></div><div class="splash-bottom">${button('Entrar no aplicativo '+I('arrow'),'enter','btn-gold')}<small>◈ PWA • Instale no seu dispositivo</small></div></section>`}
const quoteCard=q=>`<div class="list-card" data-action="detail" data-id="${esc(q.id)}" role="button" tabindex="0"><div class="list-icon">${I('file')}</div><div class="list-main"><strong>${esc(q.number)}</strong><div class="title">${esc(q.clientName)}</div><div class="meta">${esc(q.title)}</div></div><div class="list-side">${sbadge(q.status)}<strong>${cash(q.price)}</strong><small>${fmtDate(q.date)}</small></div>${I('chevron','class="list-arrow"')}</div>`;
const quoteFiltered=()=>db.quotes.filter(q=>(s.filter==='Todos'||q.status===s.filter)&&[q.clientName,q.number,q.title].join(' ').toLowerCase().includes(s.search.toLowerCase())).slice().reverse();
function quotes(){return `<section class="screen">${pageTop('Orçamentos','Pesquise e acompanhe suas propostas')}<main class="sheet full"><div class="searchbar">${I('search')}<input id="listsearch" placeholder="Buscar cliente, obra ou número..." value="${esc(s.search)}" aria-label="Pesquisar orçamentos">${I('filter')}</div><div class="tabs">${['Todos','Rascunho','Enviado','Aprovado','Em análise'].map(x=>`<button class="chip ${s.filter===x?'active':''}" data-action="filter" data-value="${x}">${x} (${x==='Todos'?db.quotes.length:db.quotes.filter(q=>q.status===x).length})</button>`).join('')}</div><div id="quote-list">${quoteFiltered().map(quoteCard).join('')||'<div class="empty">Nenhum orçamento encontrado.</div>'}</div><div class="fab-row">${button(I('plus')+' Novo orçamento','new','btn-gold fab')}</div></main></section>`}
function startNew(){s.wizard={clientId:'',clientName:'',title:'',type:'Completo',address:'',notes:'',status:'Rascunho',items:[]};s.step=1;s.newDraft=true;go('newquote')}
function editQuote(q){s.wizard=structuredClone(q);s.step=1;s.newDraft=false;go('newquote')}
function stepper(){return `<div class="stepper">${['Dados','Itens','Revisão'].map((l,i)=>`${i?'<div class="step-line"></div>':''}<div class="step-node ${i+1===s.step?'active':i+1<s.step?'done':''}"><span>${i+1<s.step?I('check'):i+1}</span>${l}</div>`).join('')}</div>`}
function wizardStep1(){const q=s.wizard;return `<div class="form-card">${titleRow('Dados do orçamento','file')}<label class="label">Cliente <span class="required">*</span></label><select name="clientId" class="input" data-wiz="1"><option value="">Selecione um cliente...</option>${db.clients.map(c=>`<option value="${c.id}" ${q.clientId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select><div style="height:7px"></div>${button(I('plus')+' Cadastrar novo cliente','client-from-quote','btn-outline block small-btn')}<label class="label">Tipo de fornecimento <span class="required">*</span></label><div class="choice-row">${[['Mão de obra','helmet','Somente<br>mão de obra'],['Completo','layers','Completo<br>(material +<br>mão de obra)'],['Misto','switch','Misto<br>(parcial)']].map(([v,ico,t])=>`<button type="button" class="choice ${q.type===v?'active':''}" data-action="type" data-value="${v}">${I(ico)}<span>${t}</span></button>`).join('')}</div><label class="label">Descrição do serviço <span class="required">*</span></label><input name="title" data-wiz="1" class="input" placeholder="Ex.: Instalação elétrica residencial" value="${esc(q.title)}"><label class="label">Local da obra</label><input class="input" name="address" data-wiz="1" placeholder="Endereço ou cidade da obra" value="${esc(q.address)}"><label class="label">Observações</label><textarea name="notes" data-wiz="1" class="input textarea" placeholder="Informações para a proposta">${esc(q.notes)}</textarea></div><div class="form-actions">${button('Salvar rascunho','draft','btn-light')}${button('Avançar '+I('arrow'),'next','btn-gold')}</div>`}
function wizardStep2(){const q=s.wizard;const calcData=calc(q);return `<div class="form-card">${titleRow('Serviços e materiais','package')}<p class="small-desc">Adicione serviços do catálogo. Em cada item, defina quem fornece os materiais.</p>${q.items.map((item,i)=>`<div class="item-card"><div class="item-card-header"><div><h4>${esc(item.service)}</h4><p>${item.qty} ${esc(item.unit)} • ${item.owner==='empresa'?'Material pela empresa':'Material pelo cliente'}</p></div><button class="icon-btn" data-action="removeitem" data-idx="${i}" style="color:#b35847">${I('trash')}</button></div><div class="item-metrics"><span>Mão de obra: ${cash(item.labor*item.qty)}</span><strong>${cash(item.qty*(item.labor+(item.owner==='empresa'?item.material:0)))}</strong></div></div>`).join('')||'<div class="empty">Nenhum serviço adicionado.<br>Comece selecionando um item da sua tabela.</div>'}${button(I('plus')+' Adicionar serviço','additem','btn-outline block')}<div class="summary-rows"><div class="summary-row"><span>Mão de obra</span><strong>${cash(calcData.labor)}</strong></div><div class="summary-row"><span>Materiais da empresa</span><strong>${cash(calcData.material)}</strong></div><div class="summary-row"><span>Custos indiretos + reserva</span><strong>${cash(calcData.overhead+calcData.reserve)}</strong></div></div></div><div class="form-actions">${button(I('back')+' Voltar','prev','btn-light')}${button('Avançar '+I('arrow'),'next','btn-gold')}</div>`}
function wizardStep3(){const q=s.wizard,c=calc(q),valid=c.denom>0;return `<div class="cost-list"><div class="cost-row"><span class="cost-icon">${I('package')}</span><span class="cost-label">Materiais fornecidos</span><b>${cash(c.material)}</b></div><div class="cost-row"><span class="cost-icon">${I('helmet')}</span><span class="cost-label">Mão de obra</span><b>${cash(c.labor)}</b></div><div class="cost-row"><span class="cost-icon">${I('truck')}</span><span class="cost-label">Despesas indiretas (${db.company.overhead}%)</span><b>${cash(c.overhead)}</b></div><div class="cost-row"><span class="cost-icon">${I('shield')}</span><span class="cost-label">Imprevistos (${db.company.reserve}%)</span><b>${cash(c.reserve)}</b></div><div class="cost-row"><span class="cost-icon">${I('chart')}</span><span class="cost-label">Lucro desejado (${db.company.profit}%)</span><b>${cash(c.profit)}</b></div><div class="cost-row"><span class="cost-icon">${I('percent')}</span><span class="cost-label">Tributos sobre venda (${db.company.tax}%)</span><b>${cash(c.taxes)}</b></div><div class="cost-row"><span class="cost-icon">${I('wallet')}</span><span class="cost-label">Taxas (${db.company.fees}%)</span><b>${cash(c.fees)}</b></div><div class="cost-row total"><span class="cost-icon">${I('coins')}</span><span class="cost-label">Custo previsto</span><b>${cash(c.cost)}</b></div></div>${valid?`<div class="price-card"><div>${I('tag')} <span>Preço sugerido</span><small>Valor calculado para margem alvo</small></div><b>${cash(c.price)}</b></div>`:'<div class="info-box">Revise seus percentuais: margem + tributos + taxas não podem chegar a 100%.</div>'}<div class="form-card">${titleRow('Finalizar proposta','file')}<label class="label">Situação inicial</label><select class="input" name="status" data-wiz="1">${['Rascunho','Enviado','Em análise','Aprovado'].map(st=>`<option ${q.status===st?'selected':''}>${st}</option>`).join('')}</select><div class="info-box">O preço apresentado é uma estimativa de demonstração. Os custos fixos (inclusive DAS MEI) devem ser corretamente rateados na base de custos. Materiais fornecidos pelo cliente não são cobrados.</div></div><div class="form-actions">${button(I('back')+' Voltar','prev','btn-light')}${button(I('save')+' Salvar proposta','finish','btn-gold',valid?'':'disabled')}</div>`}
function newquote(){return `<section class="screen">${pageTop('Novo orçamento',s.step===1?'Cliente e fornecimento':s.step===2?'Adicione serviços e custos':'Confira o valor antes de salvar',true)}<div style="background:#202125;color:#fff;padding:0 15px 21px">${stepper()}</div><main class="sheet full">${s.step===1?wizardStep1():s.step===2?wizardStep2():wizardStep3()}</main></section>`}
function detail(){const q=db.quotes.find(x=>x.id===s.detail);if(!q)return quotes();return `<section class="screen">${pageTop('Detalhes do orçamento',q.number,true)}<main class="sheet full"><div class="form-card"><div class="detail-top"><div><h2>${esc(q.clientName)}</h2>${sbadge(q.status)}</div><button class="icon-btn" data-action="editquote" data-id="${q.id}">${I('edit')}</button></div><div class="detail-label">Serviço</div><div class="detail-value">${esc(q.title)}</div><div class="detail-label">Local</div><div class="detail-value">${esc(q.address||'Não informado')}</div><div class="field-row"><div><div class="detail-label">Data</div><div class="detail-value">${fmtDate(q.date)}</div></div><div><div class="detail-label">Fornecimento</div><div class="detail-value">${esc(q.type)}</div></div></div></div><div class="form-card">${titleRow('Composição','layers')}${(q.items||[]).map(item=>`<div class="summary-row"><span>${esc(item.service)}<br><small>${item.qty} ${esc(item.unit)} · ${item.owner==='empresa'?'Empresa':'Cliente'} fornece materiais</small></span><strong>${cash(item.qty*(item.labor+(item.owner==='empresa'?item.material:0)))}</strong></div>`).join('')||'<p class="small-desc">Sem itens cadastrados.</p>'}</div><div class="price-card"><div><span>Total da proposta</span><small>Orçamento nº ${esc(q.number)}</small></div><b>${cash(q.price)}</b></div><div class="form-actions">${button(I('edit')+' Editar','editquote','btn-light',`data-id="${q.id}"`)}${button(I('eye')+' Visualizar PDF','preview','btn-gold',`data-id="${q.id}"`)}</div><label class="label">Alterar situação</label><select id="quoteStatus" class="input" data-quote-status="${q.id}">${['Rascunho','Enviado','Em análise','Aprovado','Recusado'].map(st=>`<option ${st===q.status?'selected':''}>${st}</option>`).join('')}</select><p class="inline-note">Altere o status para simular o acompanhamento. O protótipo não envia mensagens nem emite nota fiscal.</p></main></section>`}
const catalogRows=(dataset,action,renderItem)=>dataset.map(renderItem).join('')||'<div class="empty">Ainda não há registros. Use o botão Adicionar.</div>';
function clients(){return `<section class="screen">${pageTop('Clientes','Cadastro e histórico dos seus contatos')}<main class="sheet full"><div class="searchbar">${I('search')}<input id="listsearch" placeholder="Pesquisar clientes..." value="${esc(s.search)}"></div><div id="filtered-list">${clientsList()}</div><div class="fab-row">${button(I('plus')+' Novo cliente','addclient','btn-gold fab')}</div></main></section>`}

function materials(){return catalogPage('Materiais','Preço de referência e unidades','addmaterial','Novo material',db.materials,'package',m=>`${esc(m.unit)} • ${cash(m.cost)} por ${esc(m.unit)}`)}
function services(){return catalogPage('Serviços','Biblioteca de serviços e custos','addservice','Novo serviço',db.services,'tool',v=>`Mão de obra: ${cash(v.labor)} · Materiais: ${cash(v.material)} / ${esc(v.unit)}`)}
function expenses(){return catalogPage('Despesas','Despesas e custos de referência','addexpense','Nova despesa',db.expenses,'wallet',x=>`${esc(x.category)} • ${cash(x.cost)}`)}
function catalogPage(heading,sub,addAct,addLabel,items,icon,details){return `<section class="screen">${pageTop(heading,sub)}<main class="sheet full"><div class="searchbar">${I('search')}<input id="listsearch" placeholder="Pesquisar..." value="${esc(s.search)}"></div><div id="filtered-list">${items.filter(v=>v.name.toLowerCase().includes(s.search.toLowerCase())).map(v=>`<div class="list-card" data-action="editcatalog" data-id="${v.id}" data-type="${addAct}"><span class="list-icon">${I(icon)}</span><span class="list-main"><strong>${esc(v.name)}</strong><span class="meta">${details(v)}</span></span>${I('edit','class="list-arrow"')}</div>`).join('')||'<div class="empty">Nenhum item cadastrado.</div>'}</div><div class="fab-row">${button(I('plus')+' '+addLabel,addAct,'btn-gold fab')}</div></main></section>`}
function more(){const links=[['workers','Profissionais','Cadastro e custos da equipe','helmet'],['materials','Materiais','Catálogo e preços de compra','package'],['services','Serviços','Composições e tabela de preços','tool'],['expenses','Despesas','Custos e despesas da empresa','wallet'],['finance','Financeiro','Valores e movimentações previstas','coins'],['reports','Relatórios','Indicadores de orçamento','chart'],['settings','Configurações','Empresa, impostos e margens','settings']];return `<section class="screen">${pageTop('Mais opções','Todos os módulos de gestão')}<main class="sheet full"><div class="group-list">${links.map(([p,n,sub,i])=>`<button class="simple-item config-row" data-page="${p}"><span class="simple-ic">${I(i)}</span><span class="simple-content"><strong>${n}</strong><small>${sub}</small></span>${I('chevron')}</button>`).join('')}</div></main></section>`}
function finance(){const approved=db.quotes.filter(q=>q.status==='Aprovado'),v=approved.reduce((a,q)=>a+num(q.price),0),cost=approved.reduce((a,q)=>a+num(q.cost),0);return `<section class="screen">${pageTop('Financeiro','Acompanhamento previsto das propostas')}<main class="sheet full"><div class="cards-grid"><div class="statbox"><span class="stat-symbol">${I('coins')}</span><div class="small-label">Propostas aprovadas</div><div class="value">${cash(v)}</div></div><div class="statbox"><span class="stat-symbol">${I('chart')}</span><div class="small-label">Resultado estimado</div><div class="value">${cash(v-cost)}</div></div></div><div class="form-card" style="margin-top:14px">${titleRow('Valores por situação','wallet')}${['Rascunho','Enviado','Em análise','Aprovado'].map(st=>`<div class="summary-row"><span>${sbadge(st)}</span><strong>${cash(db.quotes.filter(q=>q.status===st).reduce((n,q)=>n+num(q.price),0))}</strong></div>`).join('')}</div><div class="info-box">Esta área usa apenas valores de orçamentos de demonstração. Proposta aprovada não é necessariamente faturamento recebido. Fluxo de caixa, cobranças e lançamentos reais serão desenvolvidos posteriormente.</div></main></section>`}
function reports(){const sum=db.quotes.reduce((n,q)=>n+num(q.price),0),app=db.quotes.filter(q=>q.status==='Aprovado'),max=Math.max(1,...db.quotes.map(q=>num(q.price)));return `<section class="screen">${pageTop('Relatórios','Visão geral da operação')}<main class="sheet full"><div class="cards-grid"><div class="statbox"><div class="small-label">Orçamentos cadastrados</div><div class="value">${db.quotes.length}</div></div><div class="statbox"><div class="small-label">Taxa de aprovação</div><div class="value">${db.quotes.length?Math.round(app.length/db.quotes.length*100):0}%</div></div></div><div class="form-card" style="margin-top:13px">${titleRow('Valores das propostas','chart')}<div class="small-desc">Valor total registrado: <b>${cash(sum)}</b></div><div class="chart-bars">${db.quotes.slice(-5).map(q=>`<div class="bar" style="--h:${Math.max(4,Math.round(num(q.price)/max*100))}%"><b>${Math.round(num(q.price)/1000)}k</b><small>${esc(q.number.slice(-4))}</small></div>`).join('')}</div><div style="height:27px"></div></div><div class="form-card">${titleRow('Distribuição por situação','file')}${['Aprovado','Enviado','Em análise','Rascunho','Recusado'].map(st=>`<div class="summary-row"><span>${sbadge(st)}</span><strong>${db.quotes.filter(q=>q.status===st).length}</strong></div>`).join('')}</div><div class="info-box">Indicadores calculados a partir de dados de teste armazenados localmente neste navegador.</div></main></section>`}
function settings(){let c=db.company;if(s.settings!=='root'){const labels={empresa:'Dados da empresa',impostos:'Impostos e regime tributário',margem:'Margem e precificação',preferencias:'Preferências'};return `<section class="screen">${pageTop(labels[s.settings],'Configure os parâmetros do aplicativo',true)}<main class="sheet full"><form id="settings-form" class="form-card">${s.settings==='empresa'?`${titleRow('Informações da CIVOLTEN','building')}${field('Nome fantasia','name','',c.name)}${field('Razão social','legal','Informe sua razão social',c.legal)}${field('CNPJ','cnpj','00.000.000/0000-00',c.cnpj)}${field('Telefone','phone','Contato comercial',c.phone)}${field('E-mail','email','email@exemplo.com',c.email,'email')}${field('Endereço','address','Endereço comercial',c.address)}`:s.settings==='impostos'?`${titleRow('Parâmetros tributários','percent')}${select('Regime tributário','taxRegime',['MEI','Simples Nacional','Lucro Presumido','Outro'].map(x=>({value:x,label:x})),c.taxRegime)}${field('DAS mensal (R$)','das','Ex.: 86,05',c.das,'number')}${field('Imposto proporcional à venda (%)','tax','0',c.tax,'number')}<div class="info-box">No MEI, o DAS normalmente é fixo, não uma alíquota automática sobre cada orçamento. Confirme os parâmetros aplicáveis com sua contabilidade.</div>`:s.settings==='margem'?`${titleRow('Formação do preço','chart')}${field('Margem de lucro desejada (%)','profit','',c.profit,'number')}${field('Despesas indiretas (%)','overhead','',c.overhead,'number')}${field('Reserva de imprevistos (%)','reserve','',c.reserve,'number')}${field('Taxas proporcionais de cobrança (%)','fees','',c.fees,'number')}<div class="info-box">Preço = custos totais ÷ (1 − margem − tributos sobre venda − taxas). Despesas indiretas e reserva integram os custos.</div>`:`${titleRow('Preferências','settings')}${field('Validade padrão da proposta (dias)','validity','',c.validity,'number')}<label class="label">Sugerir preço automaticamente</label><select class="input" name="autoPrice"><option value="true" ${c.autoPrice?'selected':''}>Ativado</option><option value="false" ${!c.autoPrice?'selected':''}>Desativado</option></select><label class="label">Permitir salvar rascunhos</label><select class="input" name="autoDraft"><option value="true" ${c.autoDraft?'selected':''}>Ativado</option><option value="false" ${!c.autoDraft?'selected':''}>Desativado</option></select>`}<div style="height:17px"></div><button class="btn btn-gold block" type="submit">${I('save')} Salvar configurações</button></form></main></section>`}return `<section class="screen">${pageTop('Configurações','Identidade, impostos e preferências')}<main class="sheet full"><div class="brand-banner">${pwaLogo()}<p>Elétrica & Construção Civil</p></div><div class="group-list"><button class="simple-item config-row" data-action="settings" data-value="empresa"><span class="simple-ic">${I('building')}</span><span class="simple-content"><strong>Dados da empresa</strong><small>Razão social, CNPJ, endereço e contato</small></span>${I('chevron')}</button><button class="simple-item config-row" data-action="settings" data-value="impostos"><span class="simple-ic">${I('percent')}</span><span class="simple-content"><strong>Impostos</strong><small>Alíquotas e regime de tributação</small></span>${I('chevron')}</button><button class="simple-item config-row" data-action="settings" data-value="margem"><span class="simple-ic">${I('chart')}</span><span class="simple-content"><strong>Margem padrão</strong><small>Lucro aplicado aos orçamentos</small></span><span class="pill">${num(c.profit)}%</span>${I('chevron')}</button><button class="simple-item config-row" data-page="workers"><span class="simple-ic">${I('helmet')}</span><span class="simple-content"><strong>Profissionais</strong><small>Cadastre e gerencie sua equipe</small></span>${I('chevron')}</button></div><div class="settings-title">${I('settings')} Preferências</div><div class="group-list"><div class="simple-item"><span class="simple-content"><strong>Sugerir preço automaticamente</strong><small>Calcula o preço com seus percentuais</small></span><button class="toggle ${c.autoPrice?'on':''}" data-action="toggle" data-value="autoPrice" aria-label="Alternar sugestão automática"></button></div><div class="simple-item"><span class="simple-content"><strong>Salvar orçamentos em rascunho</strong><small>Permite retomar a edição depois</small></span><button class="toggle ${c.autoDraft?'on':''}" data-action="toggle" data-value="autoDraft" aria-label="Alternar rascunhos"></button></div></div><div class="group-list"><button class="simple-item config-row" data-action="settings" data-value="preferencias"><span class="simple-ic">${I('tool')}</span><span class="simple-content"><strong>Mais preferências</strong><small>Validade e parâmetros da proposta</small></span>${I('chevron')}</button></div></main></section>`}
function preview(){const q=db.quotes.find(v=>v.id===s.detail);if(!q)return quotes();return `<section class="screen print-route">${pageTop('Visualizar proposta','Prévia do documento comercial',true)}<main class="sheet full"><article class="print-sheet"><img src="${assets.logo}" class="print-logo"><h2>PROPOSTA DE SERVIÇOS</h2><p class="small">Nº ${esc(q.number)} · ${fmtDate(q.date)}</p><div class="divider"></div><p><b>Cliente:</b> ${esc(q.clientName)}<br><b>Serviço:</b> ${esc(q.title)}<br><b>Local:</b> ${esc(q.address||'Não informado')}</p><p class="small">Fornecimento: ${esc(q.type)}</p><table><thead><tr><th>Descrição</th><th>Valor</th></tr></thead><tbody>${(q.items||[]).map(x=>`<tr><td>${esc(x.service)}<br><small>${x.qty} ${esc(x.unit)}</small></td><td>${cash(num(x.qty)*(num(x.labor)+(x.owner==='empresa'?num(x.material):0)))}</td></tr>`).join('')||'<tr><td colspan="2">Serviços a definir</td></tr>'}</tbody></table><div class="print-total">Total da proposta: ${cash(q.price)}</div><p class="small">Validade padrão: ${num(db.company.validity)} dias. Materiais do cliente não integram o valor cobrado. Proposta sujeita a conferência.</p><p class="small">CIVOLTEN — ELÉTRICA & CONSTRUÇÃO CIVIL</p></article><div class="form-actions">${button(I('back')+' Voltar','back','btn-light')}${button(I('print')+' Imprimir / salvar PDF','print','btn-gold')}</div><div class="info-box">Prévia visual do documento. Ao tocar em imprimir, utilize a opção “Salvar como PDF” do navegador, quando disponível.</div></main></section>`}
const ROUTES={splash,home,quotes,newquote,quoteDetail:detail,preview,clients,workers,materials,services,expenses,more,finance,reports,settings};
function drawer(){return `<div class="drawer" id="drawer"><div class="drawer-panel">${pwaLogo()}${[['home','Início','house'],['quotes','Orçamentos','folder'],['clients','Clientes','users'],['workers','Profissionais','helmet'],['materials','Materiais','package'],['services','Serviços','tool'],['expenses','Despesas','wallet'],['finance','Financeiro','coins'],['reports','Relatórios','chart'],['settings','Configurações','settings']].map(([p,t,ico])=>`<button data-page="${p}" class="${s.page===p?'active':''}">${I(ico)} ${t}</button>`).join('')}<hr><button data-action="closemenu">${I('close')} Fechar menu</button></div></div>`}
function modalUI(){const t=s.modal,editing=s.edit||{};const input=(a,n,type='text',placeholder='')=>field(a,n,placeholder,editing[n]??'',type);let content='';if(t==='addclient'||t==='client-from-quote')content=`${input('Nome / razão social','name','text','Nome do cliente')}${input('CPF / CNPJ (opcional)','doc')}${input('Telefone','phone','tel')}${input('E-mail','email','email')}${input('Endereço','address')}`;
else if(t==='addworker')content=`${input('Nome','name','text','Nome do profissional')}${input('Função','role','text','Eletricista, ajudante...')}${select('Vínculo','link',['Próprio','Empregado','Terceirizado'].map(x=>({value:x,label:x})),editing.link||'Terceirizado')}${input('Custo (R$)','cost','number','0')}${select('Unidade de custo','unit',['hora','diária','mês'].map(x=>({value:x,label:x})),editing.unit||'hora')}`;
else if(t==='addmaterial')content=`${input('Material','name','text','Nome do material')}${input('Unidade','unit','text','m, un, saco...')}${input('Preço de custo (R$)','cost','number','0')}`;
else if(t==='addservice')content=`${input('Serviço','name','text','Descrição do serviço')}${input('Unidade','unit','text','un, ponto, m²...')}${input('Mão de obra por unidade (R$)','labor','number','0')}${input('Material por unidade (R$)','material','number','0')}`;
else if(t==='addexpense')content=`${input('Descrição','name','text','Ex.: Transporte')}${input('Categoria','category','text','Administrativo, transporte...')}${input('Valor (R$)','cost','number','0')}`;
else if(t==='additem')content=`${select('Serviço','serviceId',db.services.map(x=>({value:x.id,label:x.name})))}${field('Quantidade','qty','Ex.: 10',1,'number',true)}${select('Materiais fornecidos por','owner',s.wizard.type==='Mão de obra'?[{value:'cliente',label:'O cliente'}]:s.wizard.type==='Completo'?[{value:'empresa',label:'Minha empresa'}]:[{value:'empresa',label:'Minha empresa'},{value:'cliente',label:'O cliente'}],s.wizard.type==='Mão de obra'?'cliente':'empresa')}<p class="small-desc">No orçamento misto, escolha o responsável por cada serviço.</p>`;
else if(t==='clientdetail'){const c=db.clients.find(x=>x.id===s.detail);content=`<p><b>${esc(c?.name)}</b></p><p class="small-desc">${esc(c?.phone||'Sem telefone')}<br>${esc(c?.email||'')}<br>${esc(c?.address||'')}</p><div class="group-list">${db.quotes.filter(q=>q.clientId===c?.id).map(q=>`<div class="simple-item"><span class="simple-content"><strong>${esc(q.number)}</strong><small>${esc(q.title)}</small></span>${sbadge(q.status)}</div>`).join('')||'<div class="simple-item">Nenhum orçamento para este cliente.</div>'}</div>`;}
return `<div class="overlay" id="overlay"><div class="modal" role="dialog" aria-modal="true" aria-label="Formulário"><div class="modal-header"><h2>${({'addclient':'Novo cliente','client-from-quote':'Cadastrar cliente','addworker':'Profissional','addmaterial':'Material','addservice':'Serviço','addexpense':'Despesa','additem':'Adicionar serviço','clientdetail':'Dados do cliente'})[t]||'Cadastro'}</h2><button class="icon-btn" data-action="closemodal" aria-label="Fechar">${I('close')}</button></div>${t==='clientdetail'?content:`<form id="modal-form">${content}<div class="form-actions">${button('Cancelar','closemodal','btn-light')}<button class="btn btn-gold" type="submit">${I('save')} Salvar</button></div></form>`}</div></div>`}
function render(){const root=$('#app');if(!root)return;root.innerHTML=`<div class="phone">${(ROUTES[s.page]||home)()}${s.page==='splash'?'':navbar()}${s.menu?drawer():''}${s.modal?modalUI():''}${s.toast?`<div class="toast" role="status">${esc(s.toast)}</div>`:''}</div>`;}
const uid=(prefix)=>prefix+Math.random().toString(36).slice(2,10);
function persistWizard(){if(!s.wizard)return;const q=s.wizard;const c=calc(q);const newItem=!q.id;q.id=q.id||uid('q');q.number=q.number||'ORC-2026-'+String(109+db.quotes.length-3).padStart(4,'0');q.date=q.date||TODAY();q.clientName=db.clients.find(x=>x.id===q.clientId)?.name||'Cliente não informado';q.cost=+c.cost.toFixed(2);q.price=+c.price.toFixed(2);q.margin=c.margin;if(newItem)db.quotes.unshift(structuredClone(q));else{const i=db.quotes.findIndex(x=>x.id===q.id);if(i>=0)db.quotes[i]=structuredClone(q);else db.quotes.unshift(structuredClone(q))}save();s.detail=q.id;s.wizard=null;s.newDraft=false;go('quoteDetail')}
function click(action,el){switch(action){case'enter':go('home');return;case'menu':s.menu=true;render();return;case'closemenu':s.menu=false;render();return;case'notifications':toast('Nenhuma notificação nova nesta demonstração.');return;case'new':startNew();return;case'filter':s.filter=el.dataset.value;render();return;case'back':if(s.modal){s.modal=null;render()}else if(s.page==='newquote'){go('quotes')}else if(s.page==='settings'&&s.settings!=='root'){s.settings='root';render()}else if(s.page==='preview'){go('quoteDetail')}else{go('quotes')}return;case'type':s.wizard.type=el.dataset.value;if(s.wizard.type==='Mão de obra')s.wizard.items.forEach(l=>l.owner='cliente');if(s.wizard.type==='Completo')s.wizard.items.forEach(l=>l.owner='empresa');render();return;case'next':if(s.step===1&&(!s.wizard.clientId||!s.wizard.title.trim())){toast('Selecione um cliente e informe a descrição do serviço.');return}if(s.step===2&&!s.wizard.items.length){toast('Adicione ao menos um serviço.');return}s.step=Math.min(3,s.step+1);render();return;case'prev':s.step=Math.max(1,s.step-1);render();return;case'additem':addModal('additem');return;case'removeitem':s.wizard.items.splice(+el.dataset.idx,1);render();return;case'client-from-quote':addModal('client-from-quote');return;case'draft':if(!s.wizard.clientId||!s.wizard.title.trim()){toast('Preencha cliente e descrição para salvar.');return}s.wizard.status='Rascunho';persistWizard();toast('Rascunho salvo neste navegador.');return;case'finish':persistWizard();toast('Orçamento salvo neste navegador.');return;case'detail':s.detail=el.dataset.id;go('quoteDetail');return;case'editquote':{let q=db.quotes.find(x=>x.id===el.dataset.id);if(q)editQuote(q);return}case'preview':s.detail=el.dataset.id;go('preview');return;case'print':window.print();return;case'clientdetail':s.detail=el.dataset.id;s.modal='clientdetail';render();return;case'editcatalog':{let type=el.dataset.type,id=el.dataset.id,table=({'addworker':'workers','addmaterial':'materials','addservice':'services','addexpense':'expenses'})[type];s.edit=db[table].find(x=>x.id===id)||null;s.modal=type;render();return}case'closemodal':s.modal=null;s.edit=null;render();return;case'settings':s.settings=el.dataset.value;render();return;case'toggle':db.company[el.dataset.value]=!db.company[el.dataset.value];save();render();return;case'addclient':case'addworker':case'addmaterial':case'addservice':case'addexpense':addModal(action);return;default:return}}
function modalSubmit(form){let t=s.modal;let vals=Object.fromEntries(new FormData(form).entries());if(t==='additem'){const sv=db.services.find(v=>v.id===vals.serviceId);if(!sv)return;const qty=Math.max(0,num(vals.qty));if(!qty){toast('Informe a quantidade do serviço.');return}s.wizard.items.push({id:uid('i'),service:sv.name,qty,unit:sv.unit,labor:num(sv.labor),material:num(sv.material),owner:vals.owner});s.modal=null;render();return}
const table=({'addclient':'clients','client-from-quote':'clients','addworker':'workers','addmaterial':'materials','addservice':'services','addexpense':'expenses'})[t];if(!table)return;if(!vals.name?.trim()){toast('Informe o nome ou descrição.');return}for(const k of ['cost','labor','material'])if(k in vals)vals[k]=num(vals[k]);let result;if(s.edit){result=db[table].find(x=>x.id===s.edit.id);Object.assign(result,vals)}else{result={id:uid(t==='addclient'?'c':t==='addworker'?'w':t==='addmaterial'?'m':t==='addservice'?'sv':'e'),...vals};db[table].push(result)}save();s.edit=null;s.modal=null;if(t==='client-from-quote'&&s.wizard)s.wizard.clientId=result.id;render();toast('Cadastro salvo neste navegador.')}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-page]');if(nav){if(nav.dataset.page==='settings')s.settings='root';go(nav.dataset.page);return}const btn=e.target.closest('[data-action]');if(btn){e.preventDefault();click(btn.dataset.action,btn);return}if(e.target.id==='overlay'){s.modal=null;render();return}if(e.target.id==='drawer'){s.menu=false;render()}});
document.addEventListener('input',e=>{const inp=e.target;if(inp.dataset.wiz&&s.wizard){const n=inp.name;s.wizard[n]=inp.value;return}if(inp.id==='listsearch'){s.search=inp.value;if(s.page==='quotes'){const p=$('#quote-list');if(p)p.innerHTML=quoteFiltered().map(quoteCard).join('')||'<div class="empty">Nenhum orçamento encontrado.</div>'}else{const p=$('#filtered-list');if(p&&s.page==='clients')p.innerHTML=clientsList();else if(p) {const m={workers,materials,services,expenses};const buffer=m[s.page]?.();const tpl=document.createElement('template');tpl.innerHTML=buffer;const filtered=tpl.content.querySelector('#filtered-list');if(filtered)p.innerHTML=filtered.innerHTML}}}});
document.addEventListener('change',e=>{if(e.target.dataset.wiz&&s.wizard){s.wizard[e.target.name]=e.target.value}if(e.target.dataset.quoteStatus){const q=db.quotes.find(v=>v.id===e.target.dataset.quoteStatus);if(q){q.status=e.target.value;save();toast('Situação alterada no protótipo.')}}});
document.addEventListener('submit',e=>{if(e.target.id==='modal-form'){e.preventDefault();modalSubmit(e.target)}if(e.target.id==='settings-form'){e.preventDefault();let vals=Object.fromEntries(new FormData(e.target).entries());for(const [k,v] of Object.entries(vals)){if(['tax','profit','overhead','reserve','fees','das','validity'].includes(k))db.company[k]=num(v);else if(['autoPrice','autoDraft'].includes(k))db.company[k]=v==='true';else db.company[k]=v}save();s.settings='root';render();toast('Configurações salvas neste navegador.')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(s.modal){s.modal=null;render()}else if(s.menu){s.menu=false;render()}}if(e.key==='Enter'&&e.target.matches('[role="button"][data-action="detail"]')){s.detail=e.target.dataset.id;go('quoteDetail')}});
render();
</script><script>if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}</script></body></html>
