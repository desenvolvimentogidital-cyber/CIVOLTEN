function reports(){const sum=db.quotes.reduce((n,q)=>n+num(q.price),0),app=db.quotes.filter(q=>q.status==='Aprovado'),max=Math.max(1,...db.quotes.map(q=>num(q.price)));return `<section class="screen">${pageTop('Relatórios','Visão geral da operação')}<main class="sheet full"><div class="cards-grid"><div class="statbox"><div class="small-label">Orçamentos cadastrados</div><div class="value">${db.quotes.length}</div></div><div class="statbox"><div class="small-label">Taxa de aprovação</div><div class="value">${db.quotes.length?Math.round(app.length/db.quotes.length*100):0}%</div></div></div><div class="form-card" style="margin-top:13px">${titleRow('Valores das propostas','chart')}<div class="small-desc">Valor total registrado: <b>${cash(sum)}</b></div><div class="chart-bars">${db.quotes.slice(-5).map(q=>`<div class="bar" style="--h:${Math.max(4,Math.round(num(q.price)/max*100))}%"><b>${Math.round(num(q.price)/1000)}k</b><small>${esc(q.number.slice(-4))}</small></div>`).join('')}</div><div style="height:27px"></div></div><div class="form-card">${titleRow('Distribuição por situação','file')}${['Aprovado','Enviado','Em análise','Rascunho','Recusado'].map(st=>`<div class="summary-row"><span>${sbadge(st)}</span><strong>${db.quotes.filter(q=>q.status===st).length}</strong></div>`).join('')}</div><div class="info-box">Indicadores calculados a partir de dados de teste armazenados localmente neste navegador.</div></main></section>`}
function settings(){let c=db.company;if(s.settings!=='root'){const labels={empresa:'Dados da empresa',impostos:'Impostos e regime tributário',margem:'Margem e precificação',preferencias:'Preferências'};return `<section class="screen">${pageTop(labels[s.settings],'Configure os parâmetros do aplicativo',true)}<main class="sheet full"><form id="settings-form" class="form-card">${s.settings==='empresa'?`${titleRow('Informações da CIVOLTEN','building')}${field('Nome fantasia','name','',c.name)}${field('Razão social','legal','Informe sua razão social',c.legal)}${field('CNPJ','cnpj','00.000.000/0000-00',c.cnpj)}${field('Telefone','phone','Contato comercial',c.phone)}${field('E-mail','email','email@exemplo.com',c.email,'email')}${field('Endereço','address','Endereço comercial',c.address)}`:s.settings==='impostos'?`${titleRow('Parâmetros tributários','percent')}${select('Regime tributário','taxRegime',['MEI','Simples Nacional','Lucro Presumido','Outro'].map(x=>({value:x,label:x})),c.taxRegime)}${field('DAS mensal (R$)','das','Ex.: 86,05',c.das,'number')}${field('Imposto proporcional à venda (%)','tax','0',c.tax,'number')}<div class="info-box">No MEI, o DAS normalmente é fixo, não uma alíquota automática sobre cada orçamento. Confirme os parâmetros aplicáveis com sua contabilidade.</div>`:s.settings==='margem'?`${titleRow('Formação do preço','chart')}${field('Margem de lucro desejada (%)','profit','',c.profit,'number')}${field('Despesas indiretas (%)','overhead','',c.overhead,'number')}${field('Reserva de imprevistos (%)','reserve','',c.reserve,'number')}${field('Taxas proporcionais de cobrança (%)','fees','',c.fees,'number')}<div class="info-box">Preço = custos totais ÷ (1 − margem − tributos sobre venda − taxas). Despesas indiretas e reserva integram os custos.</div>`:`${titleRow('Preferências','settings')}${field('Validade padrão da proposta (dias)','validity','',c.validity,'number')}<label class="label">Sugerir preço automaticamente</label><select class="input" name="autoPrice"><option value="true" ${c.autoPrice?'selected':''}>Ativado</option><option value="false" ${!c.autoPrice?'selected':''}>Desativado</option></select><label class="label">Permitir salvar rascunhos</label><select class="input" name="autoDraft"><option value="true" ${c.autoDraft?'selected':''}>Ativado</option><option value="false" ${!c.autoDraft?'selected':''}>Desativado</option></select>`}<div style="height:17px"></div><button class="btn btn-gold block" type="submit">${I('save')} Salvar configurações</button></form></main></section>`}return `<section class="screen">${pageTop('Configurações','Identidade, impostos e preferências')}<main class="sheet full"><div class="brand-banner">${pwaLogo()}<p>Elétrica & Construção Civil</p></div><div class="group-list"><button class="simple-item config-row" data-action="settings" data-value="empresa"><span class="simple-ic">${I('building')}</span><span class="simple-content"><strong>Dados da empresa</strong><small>Razão social, CNPJ, endereço e contato</small></span>${I('chevron')}</button><button class="simple-item config-row" data-action="settings" data-value="impostos"><span class="simple-ic">${I('percent')}</span><span class="simple-content"><strong>Impostos</strong><small>Alíquotas e regime de tributação</small></span>${I('chevron')}</button><button class="simple-item config-row" data-action="settings" data-value="margem"><span class="simple-ic">${I('chart')}</span><span class="simple-content"><strong>Margem padrão</strong><small>Lucro aplicado aos orçamentos</small></span><span class="pill">${num(c.profit)}%</span>${I('chevron')}</button><button class="simple-item config-row" data-page="workers"><span class="simple-ic">${I('helmet')}</span><span class="simple-content"><strong>Profissionais</strong><small>Cadastre e gerencie sua equipe</small></span>${I('chevron')}</button></div><div class="settings-title">${I('settings')} Preferências</div><div class="group-list"><div class="simple-item"><span class="simple-content"><strong>Sugerir preço automaticamente</strong><small>Calcula o preço com seus percentuais</small></span><button class="toggle ${c.autoPrice?'on':''}" data-action="toggle" data-value="autoPrice" aria-label="Alternar sugestão automática"></button></div><div class="simple-item"><span class="simple-content"><strong>Salvar orçamentos em rascunho</strong><small>Permite retomar a edição depois</small></span><button class="toggle ${c.autoDraft?'on':''}" data-action="toggle" data-value="autoDraft" aria-label="Alternar rascunhos"></button></div></div><div class="group-list"><button class="simple-item config-row" data-page="backup"><span class="simple-ic">${I('shield')}</span><span class="simple-content"><strong>Backup e restauração</strong><small>Proteja e transfira seus orçamentos</small></span>${I('chevron')}</button><button class="simple-item config-row" data-action="settings" data-value="preferencias"><span class="simple-ic">${I('tool')}</span><span class="simple-content"><strong>Mais preferências</strong><small>Validade e parâmetros da proposta</small></span>${I('chevron')}</button></div></main></section>`}
function preview(){const q=db.quotes.find(v=>v.id===s.detail);if(!q)return quotes();const c=calc(q),ratio=(q.items||[]).reduce((v,i)=>v+Math.max(0,num(i.qty))*(Math.max(0,num(i.labor))+(i.owner==='empresa'?Math.max(0,num(i.material)):0)+Math.max(0,num(i.extra))),0);return `<section class="screen print-route">${pageTop('Visualizar proposta','Documento comercial',true)}<main class="sheet full"><article class="print-sheet"><img src="${assets.logo}" class="print-logo"><h2>PROPOSTA DE SERVIÇOS</h2><p class="small">Nº ${esc(q.number)} · Versão ${q.revision||1} · ${fmtDate(q.date)}</p><div class="divider"></div><p><b>Empresa:</b> ${esc(db.company.legal||db.company.name)}<br>${db.company.cnpj?`<b>CNPJ:</b> ${esc(db.company.cnpj)}<br>`:''}${db.company.phone?`<b>Contato:</b> ${esc(db.company.phone)}<br>`:''}<b>Cliente:</b> ${esc(q.clientName)}<br><b>Serviço:</b> ${esc(q.title)}<br><b>Local:</b> ${esc(q.address||'Não informado')}</p><p class="small">Fornecimento: ${esc(q.type)}</p><table><thead><tr><th>Descrição e quantidade</th><th>Valor</th></tr></thead><tbody>${(q.items||[]).map((x,i)=>{const cost=Math.max(0,num(x.qty))*(Math.max(0,num(x.labor))+(x.owner==='empresa'?Math.max(0,num(x.material)):0)+Math.max(0,num(x.extra)));const allocated=ratio>0?q.price*(cost/ratio):0;return `<tr><td>${esc(x.service)}<br><small>${esc(x.qty)} ${esc(x.unit)} · Material: ${x.owner==='empresa'?'empresa':'cliente'}</small></td><td>${cash(allocated)}</td></tr>`}).join('')||'<tr><td colspan="2">Serviços a definir</td></tr>'}</tbody></table><div class="print-total">Total da proposta: ${cash(q.price)}</div><p class="small"><b>Prazo:</b> ${esc(q.deadline||'A combinar')}<br><b>Pagamento:</b> ${esc(q.paymentTerms||'A combinar')}<br><b>Validade:</b> ${num(q.validity??db.company.validity)} dias</p>${q.notes?`<p class="small"><b>Observações:</b> ${esc(q.notes)}</p>`:''}<p class="small">Materiais fornecidos pelo cliente não integram o valor cobrado pela CIVOLTEN.</p><p class="small">CIVOLTEN — ELÉTRICA & CONSTRUÇÃO CIVIL</p></article><div class="form-actions">${button(I('back')+' Voltar','back','btn-light')}${button(I('print')+' Imprimir / salvar PDF','print','btn-gold')}</div><div class="info-box">Use “Salvar como PDF” no menu de impressão. Confira os dados antes de enviar ao cliente.</div></main></section>`};

function downloadFile(name,data,type='application/json'){const url=URL.createObjectURL(new Blob([data],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function exportBackup(){const date=TODAY();const data={format:'civolten-backup',version:2,exportedAt:new Date().toISOString(),data:db};downloadFile('CIVOLTEN-backup-'+date+'.json',JSON.stringify(data,null,2));try{localStorage.setItem(backupKey,new Date().toISOString())}catch{};toast('Backup baixado. Guarde-o em local seguro.')}
function exportCsv(){const rows=[['Número','Data','Cliente','Serviço','Situação','Custo','Preço','Margem'],...db.quotes.map(q=>[q.number,q.date,q.clientName,q.title,q.status,q.cost,q.price,q.margin])];const text=rows.map(row=>row.map(c=>'"'+String(c??'').replaceAll('"','""')+'"').join(';')).join('\r\n');downloadFile('CIVOLTEN-orcamentos-'+TODAY()+'.csv','\ufeff'+text,'text/csv;charset=utf-8')}
async function importBackup(file){if(!file)return;let payload;try{payload=JSON.parse(await file.text())}catch{toast('Arquivo inválido. Use o backup JSON gerado pelo aplicativo.');return}if(payload?.format!=='civolten-backup'||payload.version!==2||!payload.data||!Array.isArray(payload.data.quotes)||!Array.isArray(payload.data.clients)||!payload.data.company){toast('Formato de backup não reconhecido.');return}const d=payload.data;for(const k of ['workers','materials','services','expenses'])if(!Array.isArray(d[k])){toast('Backup incompleto.');return}if(!confirm('Restaurar este backup? Os dados atuais deste navegador serão substituídos. Exporte um backup antes de continuar.'))return;db=d;db.company={...initial.company,...db.company};if(!save())return;clearTemp();s.settings='root';go('home');toast('Backup restaurado com sucesso.')}
function clearExamples(){const ids={clients:['c1','c2','c3'],workers:['w1','w2','w3'],materials:['m1','m2','m3','m4','m5'],services:['s1','s2','s3','s4','s5'],expenses:['e1','e2','e3'],quotes:['q1','q2','q3']};const count=Object.entries(ids).reduce((v,[k,arr])=>v+db[k].filter(x=>arr.includes(x.id)).length,0);if(!count){toast('Não há dados de exemplo para remover.');return}if(!confirm('Excluir os '+count+' registros de demonstração? Outros cadastros serão preservados. Faça um backup primeiro.'))return;for(const [k,arr] of Object.entries(ids))db[k]=db[k].filter(x=>!arr.includes(x.id));save();go('backup');toast('Exemplos removidos.')}
function backup(){const last=localStorage.getItem(backupKey);const sampleIds=new Set(['c1','c2','c3','w1','w2','w3','s1','s2','s3','s4','s5','q1','q2','q3','m1','m2','m3','m4','m5','e1','e2','e3']);const samples=['clients','workers','materials','services','expenses','quotes'].reduce((n,k)=>n+db[k].filter(r=>sampleIds.has(r.id)).length,0);return `<section class="screen">${pageTop('Backup e segurança','Proteja os dados do seu trabalho',true)}<main class="sheet full"><div class="form-card">${titleRow('Dados neste dispositivo','shield')}<p>Sem login, seus cadastros e orçamentos ficam armazenados somente neste navegador e dispositivo. Não são sincronizados entre celulares e podem ser perdidos se você limpar os dados do navegador ou trocar de aparelho.</p><p class="small-desc"><b>Último backup baixado:</b> ${last?new Date(last).toLocaleString('pt-BR'):'Nenhum registrado'}</p></div><div class="form-card">${titleRow('Exportar e restaurar','file')}<p class="small-desc">Exporte o arquivo JSON e guarde em uma pasta segura. Para restaurar, selecione o mesmo arquivo.</p>${button(I('save')+' Fazer backup completo (.json)','export','btn-gold block')}${button('Restaurar backup (.json)','import','btn-outline block')}<input type="file" accept=".json,application/json" id="importBackup" class="visually-hidden">${button('Exportar orçamentos (.csv)','exportcsv','btn-light block')}</div>${samples?`<div class="form-card"><b>Dados de exemplo detectados: ${samples}</b><p class="small-desc">Esses registros eram usados no protótipo. Remova-os se quiser começar com dados reais. Cadastros próprios serão preservados.</p>${button('Remover somente os exemplos','clearexamples','btn-outline block')}</div>`:''}<div class="info-box warn">Não cadastre informações sensíveis no site publicado em um dispositivo compartilhado. O login e a sincronização segura ainda serão desenvolvidos.</div></main></section>`}

const ROUTES={splash,home,quotes,newquote,quoteDetail:detail,preview,clients,workers,materials,services,expenses,more,finance,reports,settings,backup};
function drawer(){return `<div class="drawer" id="drawer"><div class="drawer-panel">${pwaLogo()}${[['home','Início','house'],['quotes','Orçamentos','folder'],['clients','Clientes','users'],['workers','Profissionais','helmet'],['materials','Materiais','package'],['services','Serviços','tool'],['expenses','Despesas','wallet'],['finance','Financeiro','coins'],['reports','Relatórios','chart'],['settings','Configurações','settings'],['backup','Backup','shield']].map(([p,t,ico])=>`<button data-page="${p}" class="${s.page===p?'active':''}">${I(ico)} ${t}</button>`).join('')}<hr><button data-action="closemenu">${I('close')} Fechar menu</button></div></div>`}
function modalUI(){const t=s.modal,editing=s.edit||{};const input=(a,n,type='text',placeholder='')=>field(a,n,placeholder,editing[n]??'',type);let content='';if(t==='addclient'||t==='client-from-quote')content=`${input('Nome / razão social','name','text','Nome do cliente')}${input('CPF / CNPJ (opcional)','doc')}${input('Telefone','phone','tel')}${input('E-mail','email','email')}${input('Endereço','address')}`;
else if(t==='addworker')content=`${input('Nome','name','text','Nome do profissional')}${input('Função','role','text','Eletricista, ajudante...')}${select('Vínculo','link',['Próprio','Empregado','Terceirizado'].map(x=>({value:x,label:x})),editing.link||'Terceirizado')}${input('Custo (R$)','cost','number','0')}${select('Unidade de custo','unit',['hora','diária','mês'].map(x=>({value:x,label:x})),editing.unit||'hora')}`;
else if(t==='addmaterial')content=`${input('Material','name','text','Nome do material')}${input('Unidade','unit','text','m, un, saco...')}${input('Preço de custo (R$)','cost','number','0')}`;
else if(t==='addservice')content=`${input('Serviço','name','text','Descrição do serviço')}${input('Unidade','unit','text','un, ponto, m²...')}${input('Mão de obra por unidade (R$)','labor','number','0')}${input('Material por unidade (R$)','material','number','0')}${editing.origin==='SIURB'?input('Custo global SIURB por unidade (R$)','referenceCost','number','0')+'<p class="small-desc">A referência SIURB é custo composto. Não some novamente mão de obra e materiais já abrangidos por esse valor.</p>':''}`;
else if(t==='addexpense')content=`${input('Descrição','name','text','Ex.: Transporte')}${input('Categoria','category','text','Administrativo, transporte...')}${input('Valor (R$)','cost','number','0')}`;
else if(t==='additem'){const opts=[{value:'',label:'Descrição manual'},...db.services.map(x=>({value:x.id,label:x.name}))];content=`${select('Serviço cadastrado (opcional)','serviceId',opts,'')}${select('Material cadastrado (opcional)','materialId',[{value:'',label:'Selecionar material'},...db.materials.map(x=>({value:x.id,label:x.name}))],'')}${select('Profissional (opcional)','workerId',[{value:'',label:'Selecionar profissional'},...db.workers.map(x=>({value:x.id,label:x.name+' — '+x.role}))],'')}${select('Despesa cadastrada (opcional)','expenseId',[{value:'',label:'Selecionar despesa'},...db.expenses.map(x=>({value:x.id,label:x.name}))],'')}${field('Descrição do item','service','Ex.: Instalação de tomadas',s.edit?.service||'')}${field('Unidade','unit','un, m, m², diária',s.edit?.unit||'un')}${field('Quantidade','qty','1',s.edit?.qty||1,'number',true)}${field('Custo de mão de obra por unidade (R$)','labor','0',s.edit?.labor||0,'number')}${field('Custo de material por unidade (R$)','material','0',s.edit?.material||0,'number')}${field('Outros custos / custo SIURB global por unidade (R$)','extra','0',s.edit?.extra||0,'number')}${select('Material fornecido por','owner',[{value:'empresa',label:'Minha empresa'},{value:'cliente',label:'O cliente'}],s.edit?.owner||(s.wizard.type==='Mão de obra'?'cliente':'empresa'))}<p class="small-desc">Escolha um item da tabela ou digite um serviço novo. Os custos SIURB são globais (mão de obra + materiais + equipamentos conforme a composição); para orçamento somente de mão de obra, edite e separe os custos antes de salvar. Em orçamento misto, defina o fornecimento por item.</p>`;}
else if(t==='clientdetail'){const c=db.clients.find(x=>x.id===s.detail);content=`<p><b>${esc(c?.name)}</b></p><p class="small-desc">${esc(c?.phone||'Sem telefone')}<br>${esc(c?.email||'')}<br>${esc(c?.address||'')}</p><div class="group-list">${db.quotes.filter(q=>q.clientId===c?.id).map(q=>`<div class="simple-item"><span class="simple-content"><strong>${esc(q.number)}</strong><small>${esc(q.title)}</small></span>${sbadge(q.status)}</div>`).join('')||'<div class="simple-item">Nenhum orçamento para este cliente.</div>'}</div>`;}
return `<div class="overlay" id="overlay"><div class="modal" role="dialog" aria-modal="true" aria-label="Formulário"><div class="modal-header"><h2>${({'addclient':'Novo cliente','client-from-quote':'Cadastrar cliente','addworker':'Profissional','addmaterial':'Material','addservice':'Serviço','addexpense':'Despesa','additem':'Adicionar serviço','clientdetail':'Dados do cliente'})[t]||'Cadastro'}</h2><button class="icon-btn" data-action="closemodal" aria-label="Fechar">${I('close')}</button></div>${t==='clientdetail'?content:`<form id="modal-form">${content}<div class="form-actions">${button('Cancelar','closemodal','btn-light')}<button class="btn btn-gold" type="submit">${I('save')} Salvar</button></div></form>`}</div></div>`}
function render(){const root=$('#app');if(!root)return;root.innerHTML=`<div class="phone">${(ROUTES[s.page]||home)()}${s.page==='splash'?'':navbar()}${s.menu?drawer():''}${s.modal?modalUI():''}${s.toast?`<div class="toast" role="status">${esc(s.toast)}</div>`:''}</div>`;}
const uid=(prefix)=>prefix+Math.random().toString(36).slice(2,10);
function persistWizard(){if(!s.wizard)return;const q=s.wizard,c=calc(q);if(!q.clientId||!q.title?.trim()){toast('Preencha cliente e descrição para salvar.');return}if(!s.newDraft&&q.status!=='Rascunho'&&(!q.items?.length||!c.valid)){toast('Adicione itens e confira o preço antes de emitir.');return}if(q.status!=='Rascunho'&&(!q.items?.length||!c.valid)){toast('Para enviar/aprovar, adicione itens e confira o preço.');return}const newItem=!q.id;const old=db.quotes.find(v=>v.id===q.id);if(old){q.history=[...(old.history||[]),{number:old.number,revision:old.revision||1,savedAt:new Date().toISOString(),snapshot:structuredClone({...old,history:undefined})}];q.revision=(old.revision||1)+1;}else q.revision=1;q.id=q.id||uid('q');if(!q.number){const yr=new Date().getFullYear();const nums=db.quotes.filter(v=>String(v.number).startsWith('ORC-'+yr+'-')).map(v=>Number(String(v.number).split('-').at(-1))).filter(Number.isFinite);const next=Math.max(0,...nums)+1;q.number='ORC-'+yr+'-'+String(next).padStart(4,'0')}q.date=q.date||TODAY();q.clientName=db.clients.find(x=>x.id===q.clientId)?.name||'Cliente não informado';q.cost=+c.cost.toFixed(2);q.price=+c.price.toFixed(2);q.profitAmount=+c.profit.toFixed(2);q.margin=+c.margin.toFixed(2);q.updatedAt=new Date().toISOString();if(newItem)db.quotes.unshift(structuredClone(q));else{const i=db.quotes.findIndex(x=>x.id===q.id);if(i>=0)db.quotes[i]=structuredClone(q);else db.quotes.unshift(structuredClone(q))}if(!save())return;clearTemp();s.detail=q.id;s.wizard=null;s.newDraft=false;go('quoteDetail')};
function click(action,el){switch(action){case'enter':go('home');return;case'menu':s.menu=true;render();return;case'closemenu':s.menu=false;render();return;case'notifications':toast('Sem novas notificações.');return;case'new':startNew();return;case'continue':openTemp();return;case'filter':s.filter=el.dataset.value;render();return;case'back':if(s.modal){s.modal=null;render()}else if(s.page==='newquote'){keepTemp();go('quotes')}else if(s.page==='settings'&&s.settings!=='root'){s.settings='root';render()}else if(s.page==='preview'){go('quoteDetail')}else{go('quotes')}return;case'type':s.wizard.type=el.dataset.value;if(s.wizard.type==='Mão de obra')s.wizard.items.forEach(l=>l.owner='cliente');if(s.wizard.type==='Completo')s.wizard.items.forEach(l=>l.owner='empresa');keepTemp();render();return;case'next':if(s.step===1&&(!s.wizard.clientId||!s.wizard.title.trim())){toast('Selecione um cliente e informe a descrição do serviço.');return}if(s.step===2&&!s.wizard.items.length){toast('Adicione ao menos um serviço.');return}s.step=Math.min(3,s.step+1);keepTemp();render();return;case'prev':s.step=Math.max(1,s.step-1);keepTemp();render();return;case'additem':s.edit=null;addModal('additem');return;case'edititem':s.edit=s.wizard.items[Number(el.dataset.idx)];s.modal='additem';render();return;case'removeitem':if(confirm('Excluir este item do orçamento?')){s.wizard.items.splice(+el.dataset.idx,1);keepTemp();render()}return;case'client-from-quote':addModal('client-from-quote');return;case'draft':s.wizard.status='Rascunho';persistWizard();toast('Rascunho salvo neste aparelho.');return;case'recalc':{const form=$('.form-card');const inputs=document.querySelectorAll('[name]');for(const inp of inputs){if(['profit','tax','fees','extraCost','discount','priceMode','manualPrice','status'].includes(inp.name))s.wizard[inp.name]=inp.value}keepTemp();render();return}case'finish':persistWizard();return;case'detail':s.detail=el.dataset.id;go('quoteDetail');return;case'editquote':{let q=db.quotes.find(x=>x.id===el.dataset.id);if(q)editQuote(q);return}case'duplicate':{const q=db.quotes.find(x=>x.id===el.dataset.id);if(!q)return;s.wizard=structuredClone(q);delete s.wizard.id;delete s.wizard.number;delete s.wizard.history;delete s.wizard.date;delete s.wizard.updatedAt;s.wizard.status='Rascunho';s.step=1;s.newDraft=true;keepTemp();go('newquote');return}case'preview':s.detail=el.dataset.id;go('preview');return;case'print':window.print();return;case'clientdetail':s.detail=el.dataset.id;s.modal='clientdetail';render();return;case'editcatalog':{let type=el.dataset.type,id=el.dataset.id,table=({'addworker':'workers','addmaterial':'materials','addservice':'services','addexpense':'expenses'})[type];s.edit=db[table].find(x=>x.id===id)||null;s.modal=type;render();return}case'closemodal':s.modal=null;s.edit=null;render();return;case'settings':s.settings=el.dataset.value;render();return;case'toggle':db.company[el.dataset.value]=!db.company[el.dataset.value];save();render();return;case'export':exportBackup();return;case'import':$('#importBackup')?.click();return;case'exportcsv':exportCsv();return;case'clearexamples':clearExamples();return;case'addclient':case'addworker':case'addmaterial':case'addservice':case'addexpense':addModal(action);return;default:return}}
function modalSubmit(form){let t=s.modal;let vals=Object.fromEntries(new FormData(form).entries());if(t==='additem'){const selected=db.services.find(v=>v.id===vals.serviceId);const base=selected||{};const editing=s.edit;const qty=num(vals.qty);if(!Number.isFinite(qty)||qty<=0){toast('Quantidade deve ser maior que zero.');return}const l={id:editing?.id||uid('i'),service:(vals.service||base.name||'').trim(),unit:(vals.unit||base.unit||'un').trim(),qty,owner:vals.owner,labor:Math.max(0,num(vals.labor||base.labor)),material:Math.max(0,num(vals.material||base.material)),extra:Math.max(0,num(vals.extra)),source:base.origin||editing?.source||'',sourceCode:base.sourceCode||editing?.sourceCode||'',sourceGroup:base.sourceGroup||editing?.sourceGroup||'',sourceDate:base.sourceDate||editing?.sourceDate||''};if(!l.service){toast('Digite uma descrição ou selecione o item cadastrado.');return}if(editing){const idx=s.wizard.items.findIndex(v=>v.id===editing.id);if(idx>=0)s.wizard.items[idx]=l}else s.wizard.items.push(l);s.edit=null;s.modal=null;keepTemp();render();return}const table=({'addclient':'clients','client-from-quote':'clients','addworker':'workers','addmaterial':'materials','addservice':'services','addexpense':'expenses'})[t];if(!table)return;if(!vals.name?.trim()){toast('Informe o nome ou descrição.');return}for(const k of ['cost','labor','material','referenceCost'])if(k in vals)vals[k]=num(vals[k]);if(table==='clients'){const duplicate=db.clients.find(c=>c.name.trim().toLowerCase()===vals.name.trim().toLowerCase()&&c.id!==s.edit?.id);if(duplicate){toast('Já existe um cliente com esse nome.');return}}let result;if(s.edit){result=db[table].find(x=>x.id===s.edit.id);Object.assign(result,vals)}else{result={id:uid(t==='addclient'?'c':t==='addworker'?'w':t==='addmaterial'?'m':t==='addservice'?'sv':'e'),...vals};db[table].push(result)}if(!save())return;s.edit=null;s.modal=null;if(t==='client-from-quote'&&s.wizard){s.wizard.clientId=result.id;keepTemp()}render();toast('Cadastro salvo neste aparelho.')};

document.addEventListener('click',e=>{const nav=e.target.closest('[data-page]');if(nav){if(nav.dataset.page==='settings')s.settings='root';go(nav.dataset.page);return}const btn=e.target.closest('[data-action]');if(btn){e.preventDefault();click(btn.dataset.action,btn);return}if(e.target.id==='overlay'){s.modal=null;render();return}if(e.target.id==='drawer'){s.menu=false;render()}});
document.addEventListener('input',e=>{const inp=e.target;if(inp.dataset.wiz&&s.wizard){const n=inp.name;s.wizard[n]=inp.value;keepTemp();return}if(inp.id==='listsearch'){s.search=inp.value;if(s.page==='quotes'){const p=$('#quote-list');if(p)p.innerHTML=quoteFiltered().map(quoteCard).join('')||'<div class="empty">Nenhum orçamento encontrado.</div>'}else{const p=$('#filtered-list');if(p&&s.page==='clients')p.innerHTML=clientsList();else if(p) {const m={workers,materials,services,expenses};const buffer=m[s.page]?.();const tpl=document.createElement('template');tpl.innerHTML=buffer;const filtered=tpl.content.querySelector('#filtered-list');if(filtered)p.innerHTML=filtered.innerHTML}}}});
document.addEventListener('change',e=>{if(e.target.name==='priceMode'&&s.wizard){s.wizard.priceMode=e.target.value;keepTemp();render();return}if(s.modal==='additem'&&['serviceId','materialId','workerId','expenseId'].includes(e.target.name)&&e.target.value){const n=e.target.name,collection=n==='serviceId'?db.services:n==='materialId'?db.materials:n==='workerId'?db.workers:db.expenses;const v=collection.find(x=>x.id===e.target.value);if(v){let data=n==='serviceId'?{service:v.name,unit:v.unit,labor:v.labor,material:v.material,extra:v.referenceCost||0}:n==='materialId'?{service:v.name,unit:v.unit,labor:0,material:v.cost,extra:0}:n==='workerId'?{service:v.name+' — '+v.role,unit:v.unit,labor:v.cost,material:0,extra:0}:{service:v.name,unit:'un',labor:0,material:0,extra:v.cost};for(const [name,value] of Object.entries(data)){const f=$('#modal-form [name='+name+']');if(f)f.value=value}for(const id of ['serviceId','materialId','workerId','expenseId']){if(id!==n){let select=$('#modal-form [name='+id+']');if(select)select.value=''}}}}if(s.page==='newquote'&&s.wizard&&['deadline','paymentTerms','validity','profit','tax','fees','extraCost','discount','priceMode','manualPrice','status'].includes(e.target.name)){s.wizard[e.target.name]=e.target.value;keepTemp()}if(e.target.dataset.wiz&&s.wizard){s.wizard[e.target.name]=e.target.value;keepTemp()}if(e.target.dataset.quoteStatus){const q=db.quotes.find(v=>v.id===e.target.dataset.quoteStatus);if(q){q.status=e.target.value;save();toast('Situação atualizada neste aparelho.')}}});
document.addEventListener('submit',e=>{if(e.target.id==='modal-form'){e.preventDefault();modalSubmit(e.target)}if(e.target.id==='settings-form'){e.preventDefault();let vals=Object.fromEntries(new FormData(e.target).entries());for(const [k,v] of Object.entries(vals)){if(['tax','profit','overhead','reserve','fees','das','validity'].includes(k))db.company[k]=num(v);else if(['autoPrice','autoDraft'].includes(k))db.company[k]=v==='true';else db.company[k]=v}if(num(db.company.profit)+num(db.company.tax)+num(db.company.fees)>=100){toast('Margem + impostos + taxas deve ser menor que 100%.');return}save();s.settings='root';render();toast('Configurações salvas neste aparelho.')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(s.modal){s.modal=null;render()}else if(s.menu){s.menu=false;render()}}if(e.key==='Enter'&&e.target.matches('[role="button"][data-action="detail"]')){s.detail=e.target.dataset.id;go('quoteDetail')}});
